name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: monitoring
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # 4. Cache Maven
      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      # 5. Cache Python
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip

      # 6. Build Java services
      - name: Build Java services
        run: |
          for service in monitoring-backend alerts-service api-gateway security-service; do
            if [ -f "$service/pom.xml" ]; then
              echo "Building $service"
              (cd $service && mvn -B clean package -DskipTests)
            else
              echo "Skipping $service (no pom.xml)"
            fi
          done

      # 7. Run Java tests
      - name: Run Java tests
        run: |
          for service in monitoring-backend alerts-service api-gateway security-service; do
            if [ -f "$service/pom.xml" ]; then
              echo "Testing $service"
              (cd $service && mvn -B test)
            fi
          done

      # 8. Python setup
      - name: Install Python deps
        run: |
          if [ -f "ai-agent/requirements.txt" ]; then
            pip install -r ai-agent/requirements.txt
          fi

      # 9. Python tests
      - name: Run Python tests
        run: |
          if [ -d "ai-agent/tests" ]; then
            cd ai-agent
            python -m pytest tests/ -v || echo "No tests found"
          fi

      # 10. Lint (safe)
      - name: Lint Python
        run: |
          if [ -d "ai-agent" ]; then
            pip install flake8
            flake8 ai-agent || echo "Lint warnings ignored"
          fi

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push images
        run: |
          for service in monitoring-backend alerts-service api-gateway security-service; do
            if [ -f "$service/Dockerfile" ]; then
              echo "Building Docker image for $service"
              docker build -t ghcr.io/${{ github.repository_owner }}/logsvar/$service:latest $service
              docker push ghcr.io/${{ github.repository_owner }}/logsvar/$service:latest
            else
              echo "Skipping $service (no Dockerfile)"
            fi
          done