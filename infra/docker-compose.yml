services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes: ["zookeeper-data:/var/lib/zookeeper/data"]
    networks: [monitoring-network]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper: { condition: service_healthy }
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes: ["kafka-data:/var/lib/kafka/data"]
    networks: [monitoring-network]

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"
    command: >-
      bash -c 'for topic in monitoring.events monitoring.anomalies monitoring.alerts monitoring.anomalies.dlq security.events security.audit;
      do kafka-topics --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1 --bootstrap-server kafka:29092;
      done'
    networks: [monitoring-network]

  mysql:
    image: mysql:8.0.39
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: monitoring
      MYSQL_USER: ${MYSQL_USER:-monitoring}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [monitoring-network]

  redis:
    image: redis:7.2.5-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [monitoring-network]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    ports: ["8180:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/monitoring-realm.json:/opt/keycloak/data/import/monitoring-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks: [monitoring-network]

  monitoring-backend:
    build: ../monitoring-backend
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/monitoring
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-monitoring}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-gateway-secret-change-in-production}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [monitoring-network]

  alerts-service:
    build: ../alerts-service
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/alerts
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-monitoring}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-gateway-secret-change-in-production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [monitoring-network]

  security-service:
    build: ../security-service
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/security
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-monitoring}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-gateway-secret-change-in-production}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [monitoring-network]

  ai-agent:
    build: ../ai-agent
    depends_on:
      monitoring-backend: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URL: redis://redis:6379
      MYSQL_HOST: mysql
      MYSQL_DATABASE: monitoring
      MYSQL_USER: ${MYSQL_USER:-monitoring}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [monitoring-network]

  api-gateway:
    build: ../api-gateway
    depends_on:
      monitoring-backend: { condition: service_healthy }
      alerts-service: { condition: service_healthy }
      security-service: { condition: service_healthy }
      ai-agent: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    ports: ["8082:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/monitoring/protocol/openid-connect/certs
      OAUTH2_ISSUER_URI: http://localhost:8180/realms/monitoring
      OAUTH2_AUDIENCE: monitoring-app
      ALLOWED_ORIGIN: http://localhost:5173
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-gateway-secret-change-in-production}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [monitoring-network]

  frontend:
    build: ../frontend
    depends_on:
      api-gateway: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    ports: ["5173:80"]
    networks: [monitoring-network]

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    networks: [monitoring-network]

  grafana:
    image: grafana/grafana:11.2.2
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring-network]

  loki:
    image: grafana/loki:3.1.1
    ports: ["3100:3100"]
    volumes: ["./loki/loki-config.yml:/etc/loki/local-config.yaml:ro", "loki-data:/loki"]
    command: -config.file=/etc/loki/local-config.yaml
    networks: [monitoring-network]

volumes:
  zookeeper-data:
  kafka-data:
  mysql-data:
  redis-data:
  keycloak-data:
  grafana-data:
  loki-data:

networks:
  monitoring-network:
    driver: bridge
