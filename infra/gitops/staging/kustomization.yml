apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: monitoring-platform-staging
  namespace: monitoring-staging

resources:
  - ../../k8s/namespace.yml
  - ../../k8s/configmaps/
  - ../../k8s/secrets/
  - ../../k8s/services/
  - ../../k8s/deployments/
  - ../../k8s/ingress/
  - ../../k8s/monitoring/

patchesStrategicMerge:
  - deployment-patches.yml

images:
  - name: monitoring-backend
    newName: ghcr.io/logsvar/monitoring-backend
    newTag: sha-${COMMIT_SHA}
  - name: alerts-service
    newName: ghcr.io/logsvar/alerts-service
    newTag: sha-${COMMIT_SHA}
  - name: api-gateway
    newName: ghcr.io/logsvar/api-gateway
    newTag: sha-${COMMIT_SHA}
  - name: ai-agent
    newName: ghcr.io/logsvar/ai-agent
    newTag: sha-${COMMIT_SHA}

commonLabels:
  app.kubernetes.io/environment: staging
  app.kubernetes.io/managed-by: kustomize

replicas:
  - name: monitoring-backend
    count: 1
  - name: alerts-service
    count: 1
  - name: api-gateway
    count: 1
  - name: ai-agent
    count: 1

configMapGenerator:
  - name: staging-config
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=INFO
      - METRICS_ENABLED=true
      - SECURITY_AUDIT_ENABLED=true
