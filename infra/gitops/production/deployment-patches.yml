---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
spec:
  template:
    spec:
      containers:
        - name: ai-agent
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DB_HOST
              value: "mysql-production"
            - name: REDIS_HOST
              value: "redis-production"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-production:9092"
            - name: SECURITY_ENHANCED
              value: "true"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-backend
spec:
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: alerts-service
spec:
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.100  # Production IP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
spec:
  type: ClusterIP
