# Production environment deployment patches
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-backend
spec:
  template:
    spec:
      containers:
        - name: monitoring-backend
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: DB_HOST
              value: "mysql-production"
            - name: REDIS_HOST
              value: "redis-production"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-production:9092"
            - name: SECURITY_ENHANCED
              value: "true"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts-service
spec:
  template:
    spec:
      containers:
        - name: alerts-service
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: DB_HOST
