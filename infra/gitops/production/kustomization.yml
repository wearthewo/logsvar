apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: monitoring-platform-production
  namespace: monitoring-production

resources:
  - ../../k8s/namespace.yml
  - ../../k8s/configmaps/
  - ../../k8s/secrets/
  - ../../k8s/services/
  - ../../k8s/deployments/
  - ../../k8s/ingress/
  - ../../k8s/monitoring/

patchesStrategicMerge:
  - deployment-patches.yml

images:
  - name: monitoring-backend
    newName: ghcr.io/logsvar/monitoring-backend
    newTag: ${VERSION_TAG}
  - name: alerts-service
    newName: ghcr.io/logsvar/alerts-service
    newTag: ${VERSION_TAG}
  - name: api-gateway
    newName: ghcr.io/logsvar/api-gateway
    newTag: ${VERSION_TAG}
  - name: ai-agent
    newName: ghcr.io/logsvar/ai-agent
    newTag: ${VERSION_TAG}

commonLabels:
  app.kubernetes.io/environment: production
  app.kubernetes.io/managed-by: kustomize

replicas:
  - name: monitoring-backend
    count: 3
  - name: alerts-service
    count: 3
  - name: api-gateway
    count: 2
  - name: ai-agent
    count: 2

configMapGenerator:
  - name: production-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=WARN
      - METRICS_ENABLED=true
      - SECURITY_AUDIT_ENABLED=true
      - PERFORMANCE_MONITORING=true

secretGenerator:
  - name: production-secrets
    literals:
      - DB_PASSWORD=prod-db-password
      - REDIS_PASSWORD=prod-redis-password
      - JWT_SECRET=prod-jwt-secret
      - KAFKA_PASSWORD=prod-kafka-password
