global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Spring Boot Services
  - job_name: "monitoring-backend"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["monitoring-backend:8080"]

  - job_name: "alerts-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["alerts-service:8081"]

  # AI Agent (Python)
  - job_name: "ai-agent"
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-agent:8001"]

  # Kafka (JMX exporter)
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9308"]

  # MySQL exporter
  - job_name: "mysql"
    static_configs:
      - targets: ["mysql-exporter:9104"]

  # Redis exporter
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Node exporter
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
